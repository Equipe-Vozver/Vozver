<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alexsandra, Daniel, Gabriel, Isabella, Laryssa, Melissa, Samuel">
    <title>Histórico de produtos - VozVer</title>

    <link rel="icon" type="image/png" href="IMG/icone-vozver-atualizado.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/historico.css">
    <script src="Js/historico.js" defer></script>
</head>

<body>
    <main class="app">

        <!-- Topo -->
        <header class="topo">
            <a class="voltar" href="Menubusca.html" aria-label="Voltar ao menu">←</a>
            <h1 class="topo-titulo">Histórico de produtos</h1>
        </header>

        <!-- Aviso: o leitor de tela fala sozinho quando o texto muda -->
        <p class="status" id="status" role="status">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
            </svg>
            <span id="texto-status">Produtos que você já consultou</span>
        </p>

        <!-- Lista dos produtos (o JavaScript preenche) -->
        <ul class="lista" id="lista" aria-label="Produtos consultados"></ul>

        <!-- Aparece quando ainda não tem nenhum produto -->
        <section class="vazio" id="vazio" hidden>
            <p>Você ainda não consultou nenhum produto.</p>
            <p>Leia um código de barras ou busque por voz e ele aparece aqui.</p>
        </section>

        <!-- Botão principal -->
        <a class="principal" href="ler_codigo_de_barras.html">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                <path d="M8 7v10M12 7v10M17 7v10"></path>
            </svg>
            <span>Ler código de barras</span>
        </a>

        <!-- Só aparece quando tem produtos na lista -->
        <button class="limpar" id="botao-limpar" type="button" hidden>Limpar histórico</button>

        <footer class="rodape-privacidade">
            <a href="politicaprivacidade.html">Política de Privacidade</a>
        </footer>
    </main>
</body>
</html>
