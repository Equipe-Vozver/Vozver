<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="tecnologia assistiva">
    <meta name="author" content="Alexsandra, Daniel, Gabriel, Isabella, Laryssa, Melissa, Samuel">
 
    <title>VozVer</title>
    <link rel="stylesheet" href="css/busca.css">
    <script src="Js/script.js"></script>
</head>
<body >
 
  <div class="app">
 
    <h1 class="titulo">Menu</h1>
 
    <div class="menu">
 
      <button class="item destaque" onclick="selecionar('Buscar produto por voz')">
        <div class="icone"><div>
          <div class="texto">Falar para buscar<br>Produto</div>
          <div class="seta"></div>
        </button>
 
     <button class="item" onclick="selecionar('Navegar no supermercado')">
        <div class="icone"><div>
          <div class="texto">Navegar no<br>Supermercado</div>
          <div class="seta"></div>
        </button>
 
        <button class="item" onclick="selecionar('Ler código de barras')">
        <div class="icone"><div>
          <div class="texto">Ler Código de<br>Barras</div>
          <div class="seta"></div>
        </button>
 
        <button class="item" onclick="selecionar('Reconhecer imagens')">
        <div class="icone"><div>
          <div class="texto">Reconhecer<br>Imagens</div>
          <div class="seta"></div>
        </button>
 
        <button class="item" onclick="selecionar('Configurações')">
        <div class="icone"><div>
          <div class="texto">Configurações</div>
          <div class="seta"></div>
        </button>
 
      </div>
 
    </div>
       
    <script>
        function selecionar(opcao) {
            alert("Você selecionou: " + opcao);
        }
    </script>
 
</body>
</html>
