<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="tecnologia assistiva">
    <meta name="author" content="Alexsandra, Daniel, Gabriel, Isabella, Laryssa, Melissa, Samuel">

    <title>VozVer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="Js/script.js"></script>
</head>

<body >

  <main class="app">

    <h1 class="titulo">Menu</h1>

    <nav class="menu">

      <button class="item destaque"
        onclick="selecionar('Buscar produto por voz')">
        <span class="icone">🎙</span>
        <span class="texto">
          Falar para buscar<br>Produto
        </span>
        <span class="seta"></span>
      </button>

      <button class="item"
        onclick="selecionar('Navegar no supermercado')">
        <span class="icone">📍</span>
        <span class="texto">
          Navegar no<br>SuperMercado
        </span>
        <span class="seta"></span>
      </button>

      <button class="item"
        onclick="selecionar('Ler código de barras')">
        <span class="icone">▥</span>
        <span class="texto">
          Ler Código de<br>Barras
        </span>
        <span class="seta"></span>
      </button>

      <button class="item"
        onclick="selecionar('Reconhecer imagens')">
        <span class="icone">📷</span>
        <span class="texto">
          Reconhecer<br>Imagens
        </span>
        <span class="seta"></span>
      </button>

      <button class="item"
        onclick="selecionar('Configurações')">
        <span class="icone">⚙</span>
        <span class="texto">
          Configurações
        </span>
        <span class="seta"></span>
      </button>

    </nav>
  </main>

  <script>
    function selecionar(opcao) {
      alert("Você selecionou: " + opcao);
    }
  </script>
</body>
</html>
