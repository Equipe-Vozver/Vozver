<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alexsandra, Daniel, Gabriel, Isabella, Laryssa, Melissa, Samuel">

    <title>Buscar Por Voz - VozVer</title>

    <link rel="icon" type="image/png" href="IMG/icone-vozver.png">

    <!-- Aqui pegamos a fonte poppins da api do google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/busca_por_voz.css">
    <script src="Js/busca_por_voz.js" defer></script>
</head>

<body>
    <main class="app">

        <header class="topo">
            <a class="voltar" href="Menubusca.html" aria-label="Voltar ao menu">←</a>
            <h1 class="topo-titulo">Buscar Por Voz</h1>
        </header>

        <section class="centro">
            <!-- <button>: aqui é uma AÇÃO (começar a ouvir), não navegação -->
            <button class="microfone" id="botao-microfone" type="button" aria-label="Começar a ouvir">
                <!-- viewBox="0 0 24 24" = a "folha quadriculada" em que o desenho foi feito.
                     width/height = o tamanho que ela ocupa na tela -->
                <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"
                     fill="none" stroke="#ffffff" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                    <path d="M5 11a7 7 0 0 0 14 0"></path>
                    <path d="M12 18v4M8 22h8"></path>
                </svg>
            </button>

            <!-- aria-live="polite": quando o texto mudar, o leitor de tela anuncia sozinho -->
            <p class="mensagem" id="mensagem" aria-live="polite">Diga o que Procura...</p>
        </section>

        <section class="base">
            <p class="exemplo">Exemplo: Arroz integral até 15 reais</p>

            <a class="cancelar" href="Menubusca.html">
                <!-- alt="" porque o ícone é só decoração: o texto "Cancelar" já diz tudo -->
                <img class="icone" src="IMG/IMG-busca-por-voz/botao-cancelar.png" alt="">
                <span>Cancelar</span>
            </a>
        </section>

    </main>
</body>

</html>
